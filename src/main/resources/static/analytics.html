<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile Viewport Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neer Drishti | Analytics Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">💧 Neer Drishti</a>
            
            <!-- Mobile Hamburger Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Live Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="villages.html">Village Database</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container px-4">
        <!-- Made flex-column on mobile, row on desktop to prevent squishing -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <h2><span id="village-title" class="text-primary">Loading...</span></h2>
            <a href="villages.html" class="btn btn-outline-dark align-self-start align-self-md-auto">← Back</a>
        </div>

        <!-- Metric Cards -->
        <div class="row mb-4">
            <!-- WQI Score Card -->
            <div class="col-md-4 mb-3 mb-md-0">
                <div class="card text-center py-3 border-info h-100">
                    <h5 class="text-muted">Total WQI Score</h5>
                    <h2 id="card-wqi">--</h2>
                </div>
            </div>
            <!-- NEW: Last Updated Card -->
            <div class="col-md-5 mb-3 mb-md-0">
                <div class="card text-center py-3 border-secondary h-100">
                    <h5 class="text-muted">Last Updated</h5>
                    <h4 id="card-last-updated" class="mt-2 text-dark">--</h4>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card p-3 h-100">
                    <h5 class="text-center">pH Levels</h5>
                    <div class="chart-container">
                        <canvas id="phChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3 h-100">
                    <h5 class="text-center">Total Dissolved Solids (TDS)</h5>
                    <div class="chart-container">
                        <canvas id="tdsChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3 h-100">
                    <h5 class="text-center">Turbidity (NTU)</h5>
                    <div class="chart-container">
                        <canvas id="turbChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS for Mobile Menu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="analytics.js"></script>
</body>
</html>
